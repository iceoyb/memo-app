<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>备忘工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 800px;
  margin: 0 auto;
}

header {
  text-align: center;
  color: white;
  margin-bottom: 30px;
}

header h1 {
  font-size: 2rem;
  font-weight: 600;
  margin-bottom: 8px;
}

header p {
  opacity: 0.85;
  font-size: 0.9rem;
}

.input-section {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}

.input-section textarea {
  width: 100%;
  min-height: 100px;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 1rem;
  font-family: inherit;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
}

.input-section textarea:focus {
  border-color: #667eea;
}

.input-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.input-row select,
.input-row input[type="text"] {
  flex: 1;
  min-width: 120px;
  padding: 10px 12px;
  border: 2px solid #e8e8e8;
  border-radius: 8px;
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s;
}

.input-row select:focus,
.input-row input[type="text"]:focus {
  border-color: #667eea;
}

.btn-add {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}

.btn-add:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}

.btn-add:active {
  transform: translateY(0);
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}

.filter-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-tag {
  background: rgba(255,255,255,0.25);
  color: white;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.3);
  transition: all 0.2s;
}

.filter-tag:hover {
  background: rgba(255,255,255,0.35);
}

.filter-tag.active {
  background: white;
  color: #667eea;
  font-weight: 500;
}

.search-box {
  position: relative;
  flex: 1;
  min-width: 200px;
}

.search-box input {
  width: 100%;
  padding: 8px 14px 8px 36px;
  border: none;
  border-radius: 20px;
  background: rgba(255,255,255,0.9);
  font-size: 0.85rem;
  outline: none;
}

.search-box::before {
  content: "🔍";
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.8rem;
}

.stats {
  color: rgba(255,255,255,0.85);
  font-size: 0.85rem;
}

.memo-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.memo-card {
  background: white;
  border-radius: 12px;
  padding: 16px 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  transition: transform 0.15s, box-shadow 0.15s;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.memo-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(0,0,0,0.15);
}

.memo-card.pinned {
  border-left: 4px solid #f59e0b;
  background: linear-gradient(to right, #fef3c7 0%, white 20%);
}

.memo-content {
  font-size: 0.95rem;
  line-height: 1.6;
  color: #333;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 10px;
}

.memo-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.memo-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.memo-tag {
  background: #eef2ff;
  color: #6366f1;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 500;
}

.memo-actions {
  display: flex;
  gap: 6px;
}

.memo-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 0.8rem;
  padding: 4px 8px;
  border-radius: 6px;
  color: #999;
  transition: all 0.15s;
}

.memo-btn:hover {
  background: #f3f4f6;
  color: #333;
}

.memo-btn.pin:hover {
  color: #f59e0b;
}

.memo-btn.delete:hover {
  color: #ef4444;
  background: #fef2f2;
}

.memo-time {
  font-size: 0.75rem;
  color: #aaa;
}

.empty-state {
  text-align: center;
  color: rgba(255,255,255,0.7);
  padding: 60px 20px;
}

.empty-state .icon {
  font-size: 3rem;
  margin-bottom: 12px;
}

.empty-state p {
  font-size: 0.95rem;
}

@media (max-width: 600px) {
  header h1 { font-size: 1.5rem; }
  .input-row { flex-direction: column; }
  .btn-add { width: 100%; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📝 我的备忘</h1>
    <p>数据安全存储在本地浏览器中</p>
  </header>

  <div class="input-section">
    <textarea id="memoInput" placeholder="写下你的备忘内容..."></textarea>
    <div class="input-row">
      <input type="text" id="tagInput" placeholder="标签（用逗号分隔）">
      <select id="categorySelect">
        <option value="普通">普通</option>
        <option value="工作">工作</option>
        <option value="生活">生活</option>
        <option value="学习">学习</option>
        <option value="想法">想法</option>
      </select>
      <button class="btn-add" onclick="addMemo()">添加备忘</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="filter-tags" id="filterTags">
      <span class="filter-tag active" data-filter="all" onclick="setFilter('all')">全部</span>
      <span class="filter-tag" data-filter="工作" onclick="setFilter('工作')">工作</span>
      <span class="filter-tag" data-filter="生活" onclick="setFilter('生活')">生活</span>
      <span class="filter-tag" data-filter="学习" onclick="setFilter('学习')">学习</span>
      <span class="filter-tag" data-filter="想法" onclick="setFilter('想法')">想法</span>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索备忘..." oninput="renderMemos()">
  </div>

  <div class="memo-list" id="memoList" style="margin-top: 20px;"></div>
</div>

<script>
const DB_KEY = 'memo_app_data_v1';
let memos = [];
let currentFilter = 'all';

// 加载数据
function loadMemos() {
  try {
    const data = localStorage.getItem(DB_KEY);
    memos = data ? JSON.parse(data) : [];
  } catch (e) {
    memos = [];
  }
}

// 保存数据
function saveMemos() {
  localStorage.setItem(DB_KEY, JSON.stringify(memos));
}

// 添加备忘
function addMemo() {
  const content = document.getElementById('memoInput').value.trim();
  const tagStr = document.getElementById('tagInput').value.trim();
  const category = document.getElementById('categorySelect').value;

  if (!content) {
    alert('请输入备忘内容');
    return;
  }

  const tags = tagStr ? tagStr.split(/[,，]/).map(t => t.trim()).filter(t => t) : [];

  const memo = {
    id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
    content,
    tags,
    category,
    pinned: false,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  memos.unshift(memo);
  saveMemos();
  renderMemos();

  document.getElementById('memoInput').value = '';
  document.getElementById('tagInput').value = '';
  document.getElementById('memoInput').focus();
}

// 删除备忘
function deleteMemo(id) {
  if (!confirm('确定删除这条备忘吗？')) return;
  memos = memos.filter(m => m.id !== id);
  saveMemos();
  renderMemos();
}

// 切换置顶
function togglePin(id) {
  const memo = memos.find(m => m.id === id);
  if (memo) {
    memo.pinned = !memo.pinned;
    memo.updatedAt = new Date().toISOString();
    saveMemos();
    renderMemos();
  }
}

// 编辑备忘
function editMemo(id) {
  const memo = memos.find(m => m.id === id);
  if (!memo) return;

  const newContent = prompt('编辑备忘内容：', memo.content);
  if (newContent !== null && newContent.trim()) {
    memo.content = newContent.trim();
    memo.updatedAt = new Date().toISOString();
    saveMemos();
    renderMemos();
  }
}

// 设置过滤
function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tag').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  renderMemos();
}

// 格式化时间
function formatTime(isoStr) {
  const d = new Date(isoStr);
  const now = new Date();
  const diff = (now - d) / 1000;

  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' 天前';

  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

// 转义 HTML
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// 渲染列表
function renderMemos() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const listEl = document.getElementById('memoList');

  let filtered = memos;

  // 分类过滤
  if (currentFilter !== 'all') {
    filtered = filtered.filter(m => m.category === currentFilter);
  }

  // 搜索过滤
  if (search) {
    filtered = filtered.filter(m =>
      m.content.toLowerCase().includes(search) ||
      m.tags.some(t => t.toLowerCase().includes(search))
    );
  }

  // 排序：置顶优先，然后按时间倒序
  filtered.sort((a, b) => {
    if (a.pinned !== b.pinned) return b.pinned - a.pinned;
    return new Date(b.createdAt) - new Date(a.createdAt);
  });

  // 更新统计
  document.getElementById('stats').textContent = `共 ${filtered.length} 条 / 总计 ${memos.length} 条`;

  // 渲染
  if (filtered.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>${memos.length === 0 ? '还没有备忘，添加第一条吧～' : '没有匹配的备忘'}</p>
      </div>
    `;
    return;
  }

  listEl.innerHTML = filtered.map(m => `
    <div class="memo-card ${m.pinned ? 'pinned' : ''}">
      <div class="memo-content">${escapeHtml(m.content)}</div>
      <div class="memo-meta">
        <div class="memo-tags">
          <span class="memo-tag">${escapeHtml(m.category)}</span>
          ${m.tags.map(t => `<span class="memo-tag">#${escapeHtml(t)}</span>`).join('')}
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="memo-time">${formatTime(m.createdAt)}</span>
          <div class="memo-actions">
            <button class="memo-btn pin" onclick="togglePin('${m.id}')" title="置顶">
              ${m.pinned ? '📌' : '📍'}
            </button>
            <button class="memo-btn" onclick="editMemo('${m.id}')" title="编辑">✏️</button>
            <button class="memo-btn delete" onclick="deleteMemo('${m.id}')" title="删除">🗑️</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

// 回车快捷添加（Ctrl/Cmd + Enter）
document.getElementById('memoInput').addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    addMemo();
  }
});

// 初始化
loadMemos();
renderMemos();
</script>
</body>
</html>
